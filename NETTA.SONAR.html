<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NETTA.SONAR</title>
<style>
:root{
  --bg:#ece6d8; --panel:#e4ddcc; --ink:#2a2622; --soft:#5f574c; --margin:#7a7063; --ghost:#bdb4a3;
  --amber:#9a6a12; --oxide:#2f6f68; --rust:#8a3b24; --line:rgba(42,38,34,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#101315; --panel:#15191b; --ink:#d7cbb3; --soft:#a89d88; --margin:#8b8273; --ghost:#3a3e41;
  --amber:#d3a24a; --oxide:#7aa8a0; --rust:#c0674a; --line:rgba(215,203,179,.09); } }
:root[data-theme="dark"]{
  --bg:#101315; --panel:#15191b; --ink:#d7cbb3; --soft:#a89d88; --margin:#8b8273; --ghost:#3a3e41;
  --amber:#d3a24a; --oxide:#7aa8a0; --rust:#c0674a; --line:rgba(215,203,179,.09); }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;overflow:hidden}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#app{display:flex;height:100%}
#scope{position:relative;flex:1;min-width:0}
canvas{display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
#hud{position:absolute;left:18px;top:14px;pointer-events:none;max-width:60%}
#hud b{display:block;font-weight:400;letter-spacing:.38em;font-size:14px}
#hud i{display:block;font-size:11px;color:var(--soft);margin-top:4px;letter-spacing:.03em}
#status{position:absolute;left:18px;bottom:14px;font-size:11.5px;color:var(--soft);pointer-events:none;letter-spacing:.03em}
#ticker{position:absolute;right:16px;top:14px;text-align:right;font-size:11px;line-height:1.55;color:var(--margin);pointer-events:none;max-width:48%}
#legend{position:absolute;right:16px;bottom:14px;text-align:right;font-size:10.5px;line-height:1.6;color:var(--margin);pointer-events:none}
#legend span{display:inline-block;width:14px;height:2px;vertical-align:middle;margin:0 5px 0 10px}
#panel{width:400px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
#log{flex:1;overflow-y:auto;padding:16px 18px 8px;font-size:14px;line-height:1.55}
.entry{margin:0 0 18px}
.who{font-size:10.5px;letter-spacing:.24em;color:var(--margin);text-transform:uppercase;margin-bottom:4px}
.say{white-space:pre-wrap;word-break:break-word}
.say span{border-bottom:1.5px solid transparent;cursor:default}
.say span{border-bottom-width:1px}
.say span.l4{border-color:color-mix(in srgb,var(--amber) 45%,transparent)} .say span.l3{border-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.say span.l2{border-color:var(--margin);border-bottom-style:dotted} .say span.l1{border-color:var(--oxide);border-bottom-style:dashed}
.say span.l0{color:var(--soft)} .say span.veto{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--rust) 25%,transparent) 60%)}
.say span.hot{background:color-mix(in srgb,var(--amber) 22%,transparent)}
.ping span{display:inline;border:0}
.ping span.lived{color:var(--ink)} .ping span.heard{color:var(--amber)} .ping span.deaf{color:var(--rust);text-decoration:line-through;text-decoration-thickness:1px}
.court{font-size:11px;color:var(--soft);margin-top:5px;line-height:1.45}
.court .pass{color:var(--oxide)} .court .fail{color:var(--rust)}
table.c{border-collapse:collapse;font-size:11px;width:100%;margin-top:4px}
table.c td{padding:2px 4px;border-bottom:1px solid var(--line);text-align:right}
table.c td:first-child{text-align:left}
.note{font-size:12px;color:var(--soft);font-style:italic}
.err{color:var(--rust);font-size:12px}
#controls{padding:10px 14px 12px;border-top:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 11px;background:var(--bg);color:var(--ink);
  border:1px solid var(--line);border-radius:3px;outline:none}
input[type=text]:focus{border-color:var(--margin)}
button{font:inherit;font-size:12.5px;letter-spacing:.06em;padding:7px 11px;background:transparent;color:var(--ink);
  border:1px solid var(--line);border-radius:3px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--margin)}
button:disabled{opacity:.4;cursor:default}
button.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label{font-size:12px;color:var(--soft);display:flex;gap:5px;align-items:center;cursor:pointer}
#heardN{font-size:11.5px;color:var(--margin);margin-left:auto}
#sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);display:none;overflow-y:auto;z-index:5;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
#sheet.open{display:block}
#sheet .box{max-width:640px;margin:0 auto;background:var(--panel);border:1px solid var(--line);padding:22px 24px;font-size:14px;line-height:1.6}
#sheet h3{font-weight:400;letter-spacing:.3em;font-size:12px;margin:18px 0 6px;color:var(--margin)}
#sheet h3:first-child{margin-top:0}
#sheet textarea{width:100%;height:140px;font-size:11.5px;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:8px}
#drop{position:fixed;inset:0;border:2px dashed var(--amber);display:none;z-index:6;pointer-events:none}
@media (max-width:820px){
  #app{flex-direction:column}
  #scope{flex:none;height:52%}
  #panel{width:auto;flex:1;border-left:0;border-top:1px solid var(--line)}
  #legend{display:none} #ticker{max-width:60%;font-size:10px} #hud i{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="scope">
    <canvas id="c"></canvas>
    <div id="hud"><b>NETTA.SONAR</b><i>a Netta that listens · rim = raw bytes, depth = longer lived units</i></div>
    <div id="ticker" class="mono"></div>
    <div id="status" class="mono">waking…</div>
    <div id="legend">support she chose from:<span style="background:var(--amber)"></span>4 units<span style="background:var(--ink)"></span>3<span style="background:var(--margin)"></span>2<span style="background:var(--oxide)"></span>1 (bare vocabulary)<br>rust = corridor veto · tap the scope to hurry</div>
  </div>
  <aside id="panel">
    <div id="log"></div>
    <div id="controls">
      <div class="row"><input id="ping" type="text" placeholder="ping her…" autocomplete="off" maxlength="600"><button id="send" class="main">ping</button></div>
      <div class="row">
        <button id="speak" title="canonical mouth, fresh seed, judged by SPEECH_COURT">speak</button>
        <button id="court" title="the five canonical seeds, report byte-identical to netta.py">court</button>
        <label><input id="keep" type="checkbox" checked> keep what she hears</label>
        <span id="heardN"></span>
      </div>
      <div class="row">
        <button id="world">world…</button><input id="file" type="file" accept=".txt,text/plain" hidden>
        <button id="memory">memory</button>
        <button id="law">law</button>
      </div>
    </div>
  </aside>
</div>
<div id="drop"></div>
<div id="sheet"><div class="box" id="sheetBox"></div></div>

<script id="engine" type="text/plain">/* NETTA — JavaScript body.
   Step-for-step port of netta.py (itself a mirror of netta.c + netta_mouth.c).
   Same merge law, same PRNG, same tie-breaks, same sampling order, same court.
   Admission test: byte-identical speech and court report against netta.py. */
(function (root) {
'use strict';

const BASE_UNITS = 256, PACK = 16, P = 65536;
const REP_WINDOW = 12, REP_PENALTY = 0.5, SPEAK_HARD = 256, MAX_EM = 65536;
const VOID_LINE = 0.50, MIN_MATCH = 32;
const PASS_LINE = 'SPEECH PASS: the mouth speaks below ignorance and above copying';

class Refusal extends Error {}

/* Correctly rounded natural log, double-double arithmetic.
   V8's Math.log is fdlibm: it can land one ulp off (Math.log(3) is), and the
   mouth's ranking compares values that are mathematically equal — ln3 − ln1.5
   against ln2 — so the last bit decides the top-k. glibc rounds correctly; so
   does this. */
const SPLIT = 134217729;
function twoSum(a, b) { const s = a + b, bb = s - a; return [s, (a - (s - bb)) + (b - bb)]; }
function twoProd(a, b) { const p = a * b;
  let t = SPLIT * a; const ah = t - (t - a), al = a - ah; t = SPLIT * b; const bh = t - (t - b), bl = b - bh;
  return [p, ((ah * bh - p) + ah * bl + al * bh) + al * bl]; }
function ddAdd(a, b) { let [s, e] = twoSum(a[0], b[0]); e += a[1] + b[1]; const h = s + e; return [h, e - (h - s)]; }
function ddMul(a, b) { let [p, e] = twoProd(a[0], b[0]); e += a[0] * b[1] + a[1] * b[0]; const h = p + e; return [h, e - (h - p)]; }
function ddDiv(a, b) { const q1 = a[0] / b[0]; let r = ddAdd(a, ddMul(b, [-q1, 0]));
  const q2 = r[0] / b[0]; r = ddAdd(r, ddMul(b, [-q2, 0])); const q3 = r[0] / b[0];
  let q = twoSum(q1, q2); q = ddAdd(q, [q3, 0]); return q; }
const LN2 = [0.6931471805599453, 2.3190468138462996e-17];
const _f = new Float64Array(1), _u = new Uint32Array(_f.buffer);
function crLog(x) {
  if (x === 1) return 0;
  _f[0] = x; let e = ((_u[1] >>> 20) & 0x7ff) - 1023;
  _u[1] = (_u[1] & 0x800fffff) | 0x3ff00000; let m = _f[0];
  if (m > Math.SQRT2) { m /= 2; e += 1; }
  const s = ddDiv([m - 1, 0], twoSum(m, 1)), s2 = ddMul(s, s);
  let t = s, acc = s;
  for (let k = 1; k < 30; k++) { t = ddMul(t, s2); if (Math.abs(t[0]) < 1e-40) break; acc = ddAdd(acc, ddDiv(t, [2 * k + 1, 0])); }
  const lm = [2 * acc[0], 2 * acc[1]];
  const r = ddAdd(ddMul([e, 0], LN2), lm);
  return r[0] + r[1];
}

/* xorshift64 — the entire source of chance */
const M64 = (1n << 64n) - 1n;
class Rng {
  constructor(state) { this.s = (BigInt.asUintN(64, BigInt(state)) & M64) || 1n; }
  next() {
    let x = this.s;
    x ^= (x << 13n) & M64;
    x ^= x >> 7n;
    x ^= (x << 17n) & M64;
    this.s = x;
    return x;
  }
  below(n) { return Number(this.next() % BigInt(n)); }
  double() { return Number(this.next() >> 11n) / 9007199254740992; }
}

/* min-heap over (-count, a, b): biggest count, then smaller a, then smaller b */
class Heap {
  constructor(items) { this.h = items; for (let i = (items.length >> 1) - 1; i >= 0; i--) this.down(i); }
  static lt(x, y) { return x[0] !== y[0] ? x[0] < y[0] : x[1] !== y[1] ? x[1] < y[1] : x[2] < y[2]; }
  push(v) { const h = this.h; h.push(v); let i = h.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (Heap.lt(h[i], h[p])) { [h[i], h[p]] = [h[p], h[i]]; i = p; } else break; } }
  pop() { const h = this.h, top = h[0], last = h.pop();
    if (h.length) { h[0] = last; this.down(0); } return top; }
  down(i) { const h = this.h, n = h.length;
    for (;;) { let m = i; const l = 2 * i + 1, r = l + 1;
      if (l < n && Heap.lt(h[l], h[m])) m = l; if (r < n && Heap.lt(h[r], h[m])) m = r;
      if (m === i) return; [h[i], h[m]] = [h[m], h[i]]; i = m; } }
  get size() { return this.h.length; }
}

/* Body 0: the merge law. onMerge(unitId, a, b, occurrences) lets a watcher see
   each unit born — the moment old bytes are re-read as one word. */
function growUnits(world, merges, minPair, onMerge) {
  const n = world.length;
  const sym = Int32Array.from(world);
  const prv = new Int32Array(n), nxt = new Int32Array(n);
  for (let i = 0; i < n; i++) { prv[i] = i - 1; nxt[i] = i + 1; }
  nxt[n - 1] = -1;
  const count = new Map(), where = new Map();
  for (let i = 0; i < n - 1; i++) {
    const k = sym[i] * P + sym[i + 1];
    count.set(k, (count.get(k) || 0) + 1);
    let w = where.get(k); if (!w) where.set(k, w = []); w.push(i);
  }
  const items = []; for (const [k, c] of count) items.push([-c, Math.floor(k / P), k % P]);
  const heap = new Heap(items);
  const bump = (k, d) => {
    const c = (count.get(k) || 0) + d;
    if (c) { count.set(k, c); if (d > 0) heap.push([-c, Math.floor(k / P), k % P]); }
    else count.delete(k);
  };
  const addWhere = (k, i) => { let w = where.get(k); if (!w) where.set(k, w = []); w.push(i); };
  const exp = []; for (let i = 0; i < BASE_UNITS; i++) exp.push(Uint8Array.of(i));
  while (exp.length - BASE_UNITS < merges) {
    let best = null;
    while (heap.size) {
      const [negc, a, b] = heap.pop();
      const live = count.get(a * P + b) || 0;
      if (live === -negc) { best = [live, a, b]; break; }
      if (live) heap.push([-live, a, b]);
    }
    if (best === null || best[0] < minPair) break;
    const [cnt, a, b] = best, nw = exp.length, ab = a * P + b;
    const e = new Uint8Array(exp[a].length + exp[b].length); e.set(exp[a]); e.set(exp[b], exp[a].length);
    exp.push(e);
    const pos = where.get(ab) || []; where.delete(ab);
    for (const i of pos) {
      if (sym[i] !== a) continue;
      const j = nxt[i];
      if (j < 0 || sym[j] !== b) continue;
      const left = prv[i], right = nxt[j];
      bump(ab, -1);
      if (left >= 0) { const sl = sym[left]; bump(sl * P + a, -1); bump(sl * P + nw, 1); addWhere(sl * P + nw, left); }
      if (right >= 0) { const sr = sym[right]; bump(b * P + sr, -1); bump(nw * P + sr, 1); addWhere(nw * P + sr, i); }
      sym[i] = nw; sym[j] = -1; nxt[i] = right;
      if (right >= 0) prv[right] = i;
    }
    if (onMerge) onMerge(nw, a, b, cnt);
  }
  const stream = []; for (let i = 0; i < n; i++) if (sym[i] >= 0) stream.push(sym[i]);
  return { stream, exp };
}

const startsUpper = e => e[0] >= 65 && e[0] <= 90;
const endsSentence = e => { const c = e[e.length - 1]; return c === 46 || c === 33 || c === 63 || c === 10; };

/* The lived stream and every n-gram actually walked.
   netta.py keeps sorted packed keys; here each level maps its prefix (≤48 bits,
   exact in a double) to continuations in ascending unit id — the same answer. */
class Tape {
  constructor(stream, exp, order, lenient) {
    this.stream = stream; this.exp = exp; this.order = order;
    const n = stream.length, n1 = new Int32Array(exp.length);
    for (const u of stream) n1[u]++;
    this.alive = []; this.uni = [];
    for (let u = 0; u < exp.length; u++) if (n1[u]) { this.alive.push(u); this.uni.push([u, n1[u]]); }
    const build = (len) => {
      const m = new Map();
      for (let i = 0; i + len < n; i++) {
        let p = 0; for (let k = 0; k < len; k++) p = p * P + stream[i + k];
        let t = m.get(p); if (!t) m.set(p, t = new Map());
        const tok = stream[i + len]; t.set(tok, (t.get(tok) || 0) + 1);
      }
      const out = new Map();
      for (const [p, t] of m) out.set(p, [...t.entries()].sort((x, y) => x[0] - y[0]));
      return out;
    };
    this.bi = build(1); this.tri = build(2); this.quad = order >= 4 ? build(3) : new Map();
    this.starts = [];
    for (let i = 0; i < n - 3; i++)
      if (startsUpper(exp[stream[i]]) && (i === 0 || endsSentence(exp[stream[i - 1]]))) this.starts.push(i);
    if (!this.starts.length && !lenient) throw new Refusal('no sentence starts');
  }
}

const EMPTY = [];
function support(tape, em, level, order) {
  const nem = em.length;
  if (level === 4) {
    if (order < 4 || nem < 3 || !tape.quad.size) return EMPTY;
    return tape.quad.get((em[nem - 3] * P + em[nem - 2]) * P + em[nem - 1]) || EMPTY;
  }
  if (level === 3) { if (nem < 2) return EMPTY; return tape.tri.get(em[nem - 2] * P + em[nem - 1]) || EMPTY; }
  if (level === 2) { if (nem < 1) return EMPTY; return tape.bi.get(em[nem - 1]) || EMPTY; }
  return tape.uni;
}

/* Amendment 2: one continuation is a rail; after K rails the mouth must branch.
   Amendment 3: the rail's own token is closed for that one choice. */
function lawfulSupport(tape, em, order, corridorK, corr) {
  let cand = EMPTY, level = 0;
  for (const lvl of [4, 3, 2, 1]) { cand = support(tape, em, lvl, order); if (cand.length) { level = lvl; break; } }
  if (!cand.length) throw new Refusal('empty lived support');
  if (cand.length >= 2) return [cand, level, null, 0];
  if (corridorK && corr >= corridorK) {
    const rail = cand[0][0];
    for (let lvl = level - 1; lvl > 0; lvl--) {
      const alt = support(tape, em, lvl, order);
      if (alt.length >= 2) {
        const admitted = alt.filter(c => c[0] !== rail);
        if (admitted.length === alt.length) throw new Refusal('lower support lost the corridor continuation');
        return [admitted, lvl, rail, 0];
      }
    }
  }
  return [cand, level, null, corridorK ? corr + 1 : corr];
}

function concat(parts) { let n = 0; for (const p of parts) n += p.length;
  const o = new Uint8Array(n); let k = 0; for (const p of parts) { o.set(p, k); k += p.length; } return o; }

/* The mouth. onStep(step) receives every choice with its whole lived support —
   this is what the inner world is drawn from, nothing else. */
function speak(tape, seed, args, onStep) {
  const rng = new Rng(BigInt(seed) ^ 0x9E3779B97F4A7C15n);
  const sp = tape.starts[rng.below(tape.starts.length)];
  const em = [tape.stream[sp], tape.stream[sp + 1], tape.stream[sp + 2]];
  const parts = []; let outLen = 0; const trace = [];
  for (let k = 0; k < 3; k++) {
    const e = tape.exp[em[k]]; parts.push(e); outLen += e.length;
    trace.push(`${k}\t${em[k]}\t${sp + k}\t0\t0\t0\t0\t${e.length}\t0\t1\t0\t-`);
    if (onStep) onStep({ index: k, tok: em[k], opening: true, start: sp + k, level: 0, cand: [], chosen: 0 });
  }
  let corr = 0, want = args.bytes; const hard = args.bytes + SPEAK_HARD;
  while (outLen < want && em.length + 1 < MAX_EM) {
    const before = corr;
    let cand, level, veto;
    [cand, level, veto, corr] = lawfulSupport(tape, em, args.order, args.corridor, corr);
    const win = em.slice(-REP_WINDOW);
    let occ = 0; const scored = [];
    for (const [tok, cnt] of cand) {
      occ += cnt;
      let rep = 0; for (const w of win) if (w === tok) rep++;
      scored.push([tok, cnt, crLog(cnt + 1e-300) - crLog(1.0 + REP_PENALTY * rep)]);
    }
    scored.sort((x, y) => (y[2] - x[2]) || (x[0] - y[0]));
    const limit = Math.min(scored.length, args.topk);
    const weights = []; let top = -1e300;
    for (let i = 0; i < limit; i++) { const v = scored[i][2] / args.temp; weights.push(v); if (v > top) top = v; }
    let total = 0.0;
    for (let i = 0; i < limit; i++) { weights[i] = Math.exp(weights[i] - top); total += weights[i]; }
    const r = rng.double() * total;
    let cum = 0.0, at = 0;
    for (let i = 0; i < limit; i++) { cum += weights[i]; if (cum > r) { at = i; break; } }
    const [tok, cnt] = scored[at];
    const e = tape.exp[tok];
    em.push(tok); parts.push(e); outLen += e.length;
    trace.push(`${em.length - 1}\t${tok}\t-\t${level}\t${cand.length}\t${occ}\t${cnt}\t${e.length}\t0\t1\t${before}\t${veto === null ? '-' : veto}`);
    if (onStep) onStep({ index: em.length - 1, tok, level, cand, occ, chosen: cnt, veto, corridor: before,
      probs: weights.map(w => w / total), ranked: scored.slice(0, limit).map(s => s[0]) });
    if (outLen >= want && !endsSentence(e) && outLen < hard) want = outLen + 1;
  }
  return { speech: concat(parts), tokens: em, trace };
}

/* The court's ear: re-derives every support from the tokens alone. */
function ear(tape, tokens, order, corridorK) {
  let model = 0.0, ignorance = 0.0;
  const perToken = Math.log2(tape.alive.length);
  const past = []; let corr = 0;
  for (let i = 0; i < tokens.length; i++) {
    const tok = tokens[i];
    let cand;
    if (i < 3) {
      cand = EMPTY;
      for (let lvl = i >= 2 ? 3 : i + 1; lvl > 0; lvl--) { cand = support(tape, past, lvl, order); if (cand.length) break; }
    } else {
      let _l, _v; [cand, _l, _v, corr] = lawfulSupport(tape, past, order, corridorK, corr);
    }
    let occ = 0, chosen = 0;

<script>

'use strict';
const $ = id => document.getElementById(id);

    w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));

/* ───────── log ───────── */

/* ───────── canonical: speak and court ───────── */

$('law').onclick = () => sheet(`
<h3>WHAT IS CANONICAL</h3>
<p>The mouth behind <b>speak</b> and the court behind <b>court</b> are a step-for-step port of <i>netta.py</i>: same merge law, same xorshift, same tie-breaks, same corridor law (amendments 2, 3), same ear and anti-copy census. The court report produced here is byte-identical to <i>python3 netta.py --report</i> — measured on netta.txt under six dial settings and on tinyshakespeare under two, including two identical FAIL verdicts. Speech walks the lived tape alone; nothing you type touches it.</p>

/* ───────── idle murmur: after a long silence she speaks a fresh canonical seed ───────── */
let lastAct = performance.now();

/* ───────── frame ───────── */
function frame(now) {
  // replay births

    const per = S.skip ? 1e9 : Math.max(3, Math.ceil((S.totalMerges || 4096) / 660));
    for (let k = 0; k < per && S.queue.length; k++) {
      const [id, a, b, cnt] = S.queue.shift(); place(id, a, b); S.heat[id] = 1; S.streamLen -= cnt;
      if (!S.skip) { S.births.push({ id, a, b, t: now }); if (S.births.length > 60) S.births.shift(); }
      S.ticker.push(`#${id - 255} ${show(S.exp[id])} ← ${show(S.exp[a])} + ${show(S.exp[b])} · ×${cnt}`); if (S.ticker.length > 6) S.ticker.shift();
    }
    $('ticker').textContent = S.ticker.join('\n'); $('ticker').style.whiteSpace = 'pre';
    if (S.grown) status(`${islandName}: ${S.worldLen.toLocaleString()} B → ${S.streamLen.toLocaleString()} units · earned ${S.n - 256}/${S.totalMerges}`);
    if (S.grown && !S.queue.length) {
      S.replaying = false; S.skip = false; S.busy = false; $('ticker').textContent = ''; setButtons(); status('listening');
      for (const [u, c] of S.grown.uni) S.freq[u] = c;
      if (S.grown.canSpeak && !S.spokeOnce) { S.spokeOnce = true; setTimeout(() => speak(7), 400); }
    }
  }
  // advance speech
  if (S.onDone && S.steps.length) {

  }
  if (!S.busy && S.grown && S.grown.canSpeak && !S.replaying && now - lastAct > 45000) { lastAct = now; speak(rndSeed()); }

function draw(now) {

    const b = S.born[u]; if (!b) continue;
    const x = px(u), y = py(u), h = S.heat[u], f = S.freq[u] ? Math.log(S.freq[u] + 1) / lf : 0.15;
    if (b === 2) { const v = S.veto[u]; ctx.fillStyle = v > 0.02 ? rgba(C.rust, 0.3 + 0.7 * v) : rgba(C.ghost, 0.9); ctx.fillRect(x - 1, y - 1, 2, 2); continue; }

    ctx.fillStyle = h > 0.02 ? rgba(C.amber, 0.35 + 0.65 * h) : rgba(C.ink, 0.12 + 0.5 * f);

    for (let b = 33; b < 127; b++) if (S.born[b] === 1 && S.arc[b] * R > 7) ctx.fillText(String.fromCharCode(b), cx + Math.cos(S.ang[b]) * (R + 11), cy + Math.sin(S.ang[b]) * (R + 11));

    ctx.beginPath(); ctx.arc(cx, cy, Math.max(1, r), 0, TAU); ctx.stroke();

  // trail: the walk through her world
  if (S.trail.length > 1) {
    const cols = LV();
    for (let i = 1; i < S.trail.length; i++) {
      const [a] = S.trail[i - 1], [b, lv] = S.trail[i], al = 0.15 + 0.6 * (i / S.trail.length);

    }
    ctx.fillStyle = col; ctx.font = '12px "Iowan Old Style",Palatino,Georgia,serif'; ctx.textAlign = 'center';
    ctx.fillText(show(S.exp[st.tok] || []), px(st.tok), py(st.tok) - 9);
    if (st.n > st.ranked.length) { ctx.fillStyle = rgba(C.margin, 0.9); ctx.font = '9.5px ui-monospace,Menlo,monospace'; ctx.fillText(`top ${st.ranked.length} of ${st.n} lived`, px(a), py(a) + 14); }
  }
  // focus: hover a unit, read it
  if (S.focus >= 0 && S.born[S.focus]) {
    const u = S.focus, x = px(u), y = py(u);
    ctx.strokeStyle = rgba(C.ink, 0.7); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.stroke();
    const label = `${show(S.exp[u] || [])}  ${S.born[u] === 2 ? '· never in this world' : u < 256 ? '· byte · ×' + S.freq[u] : '· unit #' + (u - 255) + ' · ×' + S.freq[u]}`;
    ctx.font = '11.5px ui-monospace,Menlo,monospace'; ctx.textAlign = x > W * 0.6 ? 'right' : 'left';
    ctx.fillStyle = C.bg; const w = ctx.measureText(label).width; const lx = x > W * 0.6 ? x - 10 - w : x + 10;
    ctx.globalAlpha = 0.85; ctx.fillRect(lx - 3, y - 20, w + 6, 16); ctx.globalAlpha = 1;
    ctx.fillStyle = C.ink; ctx.fillText(label, x > W * 0.6 ? x - 10 : x + 10, y - 8);
  }
}

/* ───────── wake ───────── */
setButtons();
requestAnimationFrame(frame);
setTimeout(() => grow(b64($('island').textContent), 'netta.txt'), 60);
})();
</script>
